server {
    listen 80;

    # Resolver iz /etc/resolv.conf kontejnera (Dockerov DNS, koji prosljeđuje BIND-u). Upisuje ga
    # entrypoint slike (NGINX_ENTRYPOINT_LOCAL_RESOLVERS u Dockerfileu), pa ovdje nema IP adrese.
    # valid=30s: nginx ponovo pita DNS, pa prati promjenu adrese backenda bez restarta.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # /api/notes -> http://app.proj.lab:8080/notes (backend, adresiran imenom, AO-7)
    # Ime je u varijabli: tako ga nginx razrješava pri zahtjevu, a ne samo jednom pri pokretanju.
    # S varijablom proxy_pass ne skida prefiks /api/ sam, pa to radi rewrite.
    location /api/ {
        set $backend app.proj.lab;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend:8080;
    }
}
