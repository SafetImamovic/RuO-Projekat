<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <title>Bilješke</title>
</head>
<body>
  <h1>Bilješke</h1>
  <form id="forma">
    <input id="tekst" required autofocus>
    <button>Dodaj</button>
  </form>
  <ul id="lista"></ul>
  <script>
    async function osvjezi() {
      const bilješke = await (await fetch('/api/notes')).json();
      lista.replaceChildren(...bilješke.map(b => Object.assign(document.createElement('li'), { textContent: b.text })));
    }
    forma.onsubmit = async e => {
      e.preventDefault();
      await fetch('/api/notes', { method: 'POST', body: JSON.stringify({ text: tekst.value }) });
      tekst.value = '';
      osvjezi();
    };
    osvjezi();
  </script>
</body>
</html>
