- hosts: servers
  become: true
  gather_facts: false
  pre_tasks:
    - name: čekaj da SSH postane dostupan
      ansible.builtin.wait_for_connection: { timeout: 300 }
      tags: always
    - name: čekaj da cloud-init završi
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      tags: always
    - name: prikupi činjenice
      ansible.builtin.setup:
      tags: always
  roles:
    - { role: docker, tags: [config, deploy] }
    - { role: dns, tags: config }
    - { role: app, tags: deploy }
