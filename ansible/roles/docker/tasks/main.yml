- name: Docker Engine, Compose i Python biblioteka za Ansible module
  ansible.builtin.apt:
    name: [docker.io, docker-compose, python3-docker]
    state: present
    cache_valid_time: 3600

- name: Docker radi
  ansible.builtin.service: { name: docker, state: started, enabled: true }

- name: direktorij projekta
  ansible.builtin.file: { path: "{{ project_dir }}", state: directory, mode: "0755" }

- name: compose.yaml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/compose.yaml"
    dest: "{{ project_dir }}/compose.yaml"
    mode: "0644"

- name: .env (tajne, samo root čita)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ project_dir }}/.env"
    mode: "0600"
  no_log: true
