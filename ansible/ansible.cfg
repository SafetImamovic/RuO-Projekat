[defaults]
inventory = ../terraform/vm/inventory.ini
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
# Podrazumijevani argumenti + VM-ov host ključ se ne pamti (VM se kreira od nule, ključ je svaki put novi).
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
